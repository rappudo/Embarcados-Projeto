# Configuração do broker para ambiente exposto (EC2).
#
# - Sem auth anônima: backend e edge precisam apresentar usuário/senha.
# - listener em 0.0.0.0 para aceitar a Pi pela internet. Em deploy local
#   sem internet, bloquear via security group (porta 1883 só do IP da Pi).
# - Persistência ligada para mensagens retidas (sync de embeddings) e
#   queues QoS-1 dos clientes com clean_session=false.

listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwordfile

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
