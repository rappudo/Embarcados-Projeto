# FaceGateway — Edge Device Configuration
# Save this file as config.toml and run with: ./facegate --config /path/to/config.toml

# Unique identifier for this device. Shows up in all published events.
device_id = "rpi-entrance-01"

# -----------------------------------------------------------------------------
# Computer Vision
# -----------------------------------------------------------------------------
[vision]
# Cosine distance threshold for a match.
# Note: ArcFace generally requires a slightly different threshold than MobileFaceNet.
# 0.50 is a safe starting point for ArcFace (adjust up if it's too strict, down if false positives occur).
threshold = 0.50

# Paths to the ONNX models (using the upgraded ArcFace model)
blazeface_model = "models/blaze.onnx"
mobilefacenet_model = "models/arc.onnx"

# Number of threads used by ONNXRuntime.
# 2 threads is perfect for a Pi 4, leaving 2 cores for OS/MQTT/Camera tasks.
onnx_threads = 2

# -----------------------------------------------------------------------------
# Camera
# -----------------------------------------------------------------------------
[camera]
# Standard CSI or USB camera device path
device = "http://10.187.240.133:8080/video"

# 640x480 is the sweet spot. Higher resolutions just waste CPU resizing the image down for the AI.
width = 640
height = 480
fps = 30

# -----------------------------------------------------------------------------
# GPIO — Physical Actuators (Turnstile / Buzzer)
# -----------------------------------------------------------------------------
[gpio]
# BCM Pinout numbering
relay_pin = 17
buzzer_pin = 27

# Durations in milliseconds
relay_pulse_ms = 1500
buzzer_beep_ms = 300
enabled = false

# -----------------------------------------------------------------------------
# Local Storage
# -----------------------------------------------------------------------------
[storage]
# SQLite path for local embedding cache and offline events
sqlite_path = "cache.db"

# -----------------------------------------------------------------------------
# MQTT — Backend Communication
# -----------------------------------------------------------------------------
[mqtt]
# CHANGE THIS to the actual IP address of the machine running your Rust backend!
broker_host = "127.0.0.1"
broker_port = 1883

client_id = "rpi-entrance-01"
keepalive_seconds = 60
heartbeat_interval_seconds = 30

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
[logging]
level = "info"
