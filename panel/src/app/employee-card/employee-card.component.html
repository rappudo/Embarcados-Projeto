<article class="employee-card">
  <div class="employee-card-photo">
    <img [src]="foto" [alt]="'Foto de ' + nome" />
  </div>

  <div class="employee-card-info">
    <h3 class="employee-card-name">{{ nome }}</h3>

    <dl class="employee-card-details">
      <div class="employee-card-detail">
        <dt>Idade</dt>
        <dd>{{ idade }} anos</dd>
      </div>
      <div class="employee-card-detail">
        <dt>Data de Ingresso</dt>
        <dd>{{ dataIngresso | date: 'dd/MM/yyyy' }}</dd>
      </div>
    </dl>
  </div>
</article>
