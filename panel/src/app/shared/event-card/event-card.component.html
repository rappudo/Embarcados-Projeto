<ion-item>
  <ion-icon
    slot="start"
    [name]="iconName()"
    [color]="iconColor()"
    class="status-icon"
    aria-hidden="true"
  >
  </ion-icon>

  <ion-label>
    <h2 [class.unknown]="event().status === 'unknown'">
      {{ displayName() }}
    </h2>
    <p>{{ relativeTime() }}</p>
  </ion-label>

  @if (event().distance !== null) {
    <ion-chip slot="end" outline="true" class="distance-chip">
      {{ event().distance!.toFixed(2) }}
    </ion-chip>
  }
</ion-item>
