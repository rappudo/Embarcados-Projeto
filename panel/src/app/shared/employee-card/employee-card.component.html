<!--
  `button` makes the row tappable (Ionic ripple effect + cursor).
  `detail="true"` shows the right-chevron indicator: "tap for more".
  [routerLink] binds the URL array: ['/employees', 3] → /employees/3
-->
<ion-item button detail="true" [routerLink]="['/employees', employee().id]">
  <ion-avatar slot="start" class="initial-avatar">
    <span>{{ initial() }}</span>
  </ion-avatar>

  <ion-label>
    <h2>{{ employee().name }}</h2>
    @if (employee().shift) {
      <p>Turno: {{ employee().shift }}</p>
    } @else {
      <p class="no-shift">Sem turno definido</p>
    }
  </ion-label>
</ion-item>
