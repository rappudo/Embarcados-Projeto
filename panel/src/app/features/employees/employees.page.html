<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button menu="main-menu"></ion-menu-button>
    </ion-buttons>
    <ion-title>Funcionários</ion-title>
    <ion-buttons slot="end">
      <ion-button id="open-create-modal" aria-label="Adicionar funcionário">
        <ion-icon name="add-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="onRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  @if (loading()) {
  <div class="centered">
    <ion-spinner name="dots"></ion-spinner>
  </div>
  } @else if (employees().length === 0) {
  <div class="centered empty-state">
    <p>Nenhum funcionário cadastrado.</p>
    <ion-button id="open-create-modal" fill="outline">
      Cadastrar o primeiro
    </ion-button>
  </div>
  } @else {
  <ion-list>
    @for (emp of employees(); track emp.id) {
    <app-employee-card [employee]="emp" />
    }
  </ion-list>
  }
</ion-content>

<ion-modal #createModal trigger="open-create-modal">
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-button (click)="createModal.dismiss()">Cancelar</ion-button>
        </ion-buttons>
        <ion-title>Novo funcionário</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content class="ion-padding">
      <form [formGroup]="createForm" (ngSubmit)="onCreateSubmit()">
        <ion-item>
          <ion-input
            label="Nome"
            labelPlacement="floating"
            type="text"
            autocomplete="name"
            formControlName="name"
          >
          </ion-input>
        </ion-item>

        <ion-item>
          <ion-select
            label="Turno"
            labelPlacement="floating"
            interface="popover"
            placeholder="(opcional)"
            formControlName="shift"
          >
            <ion-select-option [value]="null">Sem turno</ion-select-option>
            <ion-select-option value="manhã">Manhã</ion-select-option>
            <ion-select-option value="tarde">Tarde</ion-select-option>
            <ion-select-option value="noite">Noite</ion-select-option>
          </ion-select>
        </ion-item>

        <ion-button
          expand="block"
          type="submit"
          class="ion-margin-top"
          [disabled]="createForm.invalid || creating()"
        >
          @if (creating()) {
          <ion-spinner name="dots"></ion-spinner>
          } @else { Cadastrar }
        </ion-button>
      </form>
    </ion-content>
  </ng-template>
</ion-modal>
