<ion-app>
  <!--
    SplitPane shows menu+content side-by-side on screens ≥ 992px and
    collapses to a slide-out drawer below that breakpoint.
    The when="md" string is a CSS media query; "md" expands to
    "(min-width: 768px)" in Ionic's preset. The default of "lg" was
    too narrow for our admin panel.
  -->
  <!--
    `[disabled]="!auth.isLoggedIn()"` hides the menu on the login page
    so the unauthenticated screen stays clean. Once login succeeds, the
    signal flips and the drawer becomes available.
  -->
  <ion-split-pane contentId="main-content" when="md" [disabled]="!auth.isLoggedIn()">
    <ion-menu
      contentId="main-content"
      menuId="main-menu"
      type="overlay"
      [disabled]="!auth.isLoggedIn()"
    >
      <ion-header>
        <ion-toolbar color="primary">
          <ion-title>FaceGateway</ion-title>
        </ion-toolbar>
      </ion-header>

      <ion-content>
        <ion-list lines="none">
          <ion-list-header>Navegação</ion-list-header>

          @for (item of menuItems; track item.url) {
          <ion-menu-toggle auto-hide="false">
            <ion-item
              [routerLink]="item.url"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: false }"
              button
              detail="false"
            >
              <ion-icon slot="start" [name]="item.icon"></ion-icon>
              <ion-label>{{ item.label }}</ion-label>
            </ion-item>
          </ion-menu-toggle>
          }
        </ion-list>

        <!--
          Logout sits separately at the bottom so it never gets a
          routerLinkActive treatment — it's an action, not a route.
        -->
        <ion-list lines="none" class="logout-list">
          <ion-item button detail="false" (click)="logout()">
            <ion-icon slot="start" name="log-out-outline" color="danger"></ion-icon>
            <ion-label color="danger">Sair</ion-label>
          </ion-item>
          <ion-note class="version-note">v0.1.0 — demo build</ion-note>
        </ion-list>
      </ion-content>
    </ion-menu>

    <!--
      The page is routed into this outlet. The id ties it to the menu's
      contentId; the menu controller uses this to know which region to
      shift when the drawer opens.
    -->
    <div id="main-content" class="ion-page">
      <router-outlet></router-outlet>
    </div>
  </ion-split-pane>
</ion-app>
