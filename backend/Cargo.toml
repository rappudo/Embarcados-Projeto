[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["multipart"] }
sqlx = { version = "0.8", features = [ "runtime-tokio", "tls-rustls", "postgres", "chrono" ] }
rumqttc = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
sha2 = "0.11.0"
pgvector = { version = "^0.4", features = ["sqlx"] }
tower-http = { version = "^0.5", features = ["cors", "fs"] }
# OpenAPI / Swagger UI. The spec is generated at compile time from
# `#[derive(ToSchema)]` on the DTOs and `#[utoipa::path(...)]` on the
# handlers. `axum` feature on utoipa-swagger-ui mounts the UI as a
# regular Axum service at /swagger-ui.
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
# utoipa-swagger-ui 8 is the last release compatible with axum 0.7; 9.x
# requires axum 0.8. Pin until the project bumps axum.
utoipa-swagger-ui = { version = "8", features = ["axum"] }

[dev-dependencies]
# Integration-test harness. `axum-test` spins up the router on a real
# TCP port and gives a `reqwest`-style client. `once_cell` runs the
# one-time DB setup (create test DB + migrations) exactly once across
# all test files. `hex` is for SHA-256 hash assertions.
axum-test = "15"
once_cell = "1"
hex = "0.4"
